[project]
name = "j1939-can-bench-reader"
version = "0.2.0"
description = "Public CAN/J1939 bench reader lab with synthetic frames and generic parsing."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
